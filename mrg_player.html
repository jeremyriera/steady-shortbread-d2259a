<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MRG Video Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body {
      margin: 0;
      padding: 0 0 75px 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }
    .ctrl-btn {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .ctrl-btn.active {
      background: #FF6719;
      border-color: #FF6719;
    }
    .ctrl-select {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Header Controls (Substack Button + Language Selector) -->
  <div style="max-width: 800px; margin: 20px auto 12px auto; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-sizing: border-box;">
    
    <!-- Substack Back Button -->
    <a id="back-to-substack" 
       href="https://jeremypaul23.substack.com" 
       title="Return to Substack"
       style="
         display: inline-flex;
         align-items: center;
         gap: 8px;
         padding: 8px 14px;
         background-color: #ffffff;
         color: #FF6719;
         font-size: 14px;
         font-weight: 600;
         text-decoration: none;
         border-radius: 8px;
         border: 1px solid #ffe0d0;
         box-shadow: 0 2px 8px rgba(0,0,0,0.08);
       ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#FF6719" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>
      </svg>
      Back to Newsletter
    </a>

    <!-- Language Selector Dropdown -->
    <select id="language-picker" 
            aria-label="Select language"
            style="
              padding: 8px 12px;
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              font-size: 14px;
              font-weight: 500;
              color: #333333;
              background-color: #ffffff;
              border: 1px solid #ddd;
              border-radius: 8px;
              box-shadow: 0 2px 8px rgba(0,0,0,0.08);
              outline: none;
              cursor: pointer;
            ">
      <option value="es" selected>Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
    </select>
  </div>

  <!-- Video Container -->
  <div style="max-width: 800px; margin: 0 auto; padding: 0 10px; box-sizing: border-box;">
    <div id="video-wrapper" style="width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; position: relative;">
      <div id="yt-player" style="width: 100%; height: 100%; pointer-events: none;"></div>
    </div>
  </div>

  <!-- Fixed Bottom Controls Bar -->
  <div id="bottom-controls" style="
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 20px;
    box-sizing: border-box;
    z-index: 9999;
  ">
    <!-- Play/Pause -->
    <button id="play-pause-btn" class="ctrl-btn" title="Play / Pause">▶ Play</button>

    <!-- Volume -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="mute-btn" class="ctrl-btn" title="Mute / Unmute" style="padding: 6px 10px;">🔊</button>
      <input type="range" id="volume-slider" min="0" max="100" value="100" style="width: 85px; accent-color: #FF6719; cursor: pointer;">
    </div>

    <!-- Playback Speed -->
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 13px; color: #94a3b8;">Speed:</span>
      <select id="speed-select" class="ctrl-select">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2.0x</option>
      </select>
    </div>

    <!-- Captions (CC) -->
    <button id="cc-btn" class="ctrl-btn" title="Toggle Captions">CC</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('video');

    // Dynamic Substack Return Target
    const returnTarget = urlParams.get('return');
    const backButton = document.getElementById('back-to-substack');
    if (backButton) {
      if (returnTarget) {
        backButton.href = returnTarget.startsWith('http') 
          ? returnTarget 
          : 'https://jeremypaul23.substack.com' + returnTarget;
      } else if (document.referrer && document.referrer.includes('jeremypaul23.substack.com')) {
        backButton.href = document.referrer;
      } else {
        backButton.href = 'https://jeremypaul23.substack.com';
      }
    }

    let player;
    let ccActive = false;

    function onYouTubeIframeAPIReady() {
      if (!videoId) {
        document.getElementById('video-wrapper').innerHTML = "<div style='color:#fff;display:flex;height:100%;align-items:center;justify-content:center;'>No video specified.</div>";
        return;
      }

      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          controls: 0,
          rel: 0,
          modestbranding: 1,
          disablekb: 1,
          iv_load_policy: 3
        },
        events: {
          'onReady': setupControls,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function setupControls() {
      const playBtn = document.getElementById('play-pause-btn');
      const muteBtn = document.getElementById('mute-btn');
      const volumeSlider = document.getElementById('volume-slider');
      const speedSelect = document.getElementById('speed-select');
      const ccBtn = document.getElementById('cc-btn');

      // Play / Pause Toggle
      playBtn.addEventListener('click', () => {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      });

      // Mute / Unmute Toggle
      muteBtn.addEventListener('click', () => {
        if (player.isMuted()) {
          player.unMute();
          muteBtn.textContent = '🔊';
          volumeSlider.value = player.getVolume() || 100;
        } else {
          player.mute();
          muteBtn.textContent = '🔇';
          volumeSlider.value = 0;
        }
      });

      // Volume Slider
      volumeSlider.addEventListener('input', (e) => {
        const vol = parseInt(e.target.value, 10);
        player.setVolume(vol);
        if (vol === 0) {
          player.mute();
          muteBtn.textContent = '🔇';
        } else {
          if (player.isMuted()) player.unMute();
          muteBtn.textContent = '🔊';
        }
      });

      // Speed Selector
      speedSelect.addEventListener('change', (e) => {
        player.setPlaybackRate(parseFloat(e.target.value));
      });

      // Captions (CC) Toggle
      ccBtn.addEventListener('click', () => {
        ccActive = !ccActive;
        if (ccActive) {
          player.loadModule('captions');
          player.setOption('captions', 'track', { languageCode: 'es' });
          ccBtn.classList.add('active');
        } else {
          player.unloadModule('captions');
          ccBtn.classList.remove('active');
        }
      });
    }

    function onPlayerStateChange(event) {
      const playBtn = document.getElementById('play-pause-btn');
      if (event.data === YT.PlayerState.PLAYING) {
        playBtn.textContent = '⏸ Pause';
      } else {
        playBtn.textContent = '▶ Play';
      }
    }
  </script>
</body>
</html>
